name: CI

env:
  IC_TESTKIT_MSRV: 1.88.0
  IC_TESTKIT_INTERNAL_TOOLCHAIN: 1.99.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  msrv:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_TESTKIT_MSRV }}
      - name: Pin cargo/rustc to MSRV
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TESTKIT_MSRV" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Check MSRV
        run: make msrv

  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: true
          fetch-depth: 0
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_TESTKIT_INTERNAL_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Pin cargo/rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TESTKIT_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare the pinned manifest formatter
        run: make install-format-tools
      - name: Run complete CI gate
        run: make ci

  portable-hosts:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_TESTKIT_INTERNAL_TOOLCHAIN }}
          components: rustfmt
      - name: Pin cargo/rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TESTKIT_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare the pinned manifest formatter
        run: make install-format-tools
      - name: Select system Bash on macOS
        if: runner.os == 'macOS'
        run: echo /bin >> "$GITHUB_PATH"
      - name: Prepare selected dependencies
        run: cargo fetch --locked
      - name: Verify portable operator tooling with the system Bash
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        run: |
          /bin/bash scripts/ci/verify-shared-tooling-snapshot.sh
          /bin/bash scripts/ci/check-release-guards.sh
          /bin/bash scripts/ci/check-installation-version.sh
          /bin/bash scripts/ci/check-publish-guards.sh
          /bin/bash scripts/ci/check-github-actions-pinned.sh
          /bin/bash scripts/ci/check-git-hooks.sh
          make fmt-check
      - name: Check native managed-server lifecycle
        run: cargo test -p ic-testkit --locked --offline --lib pic::startup::tests
      - name: Check synthetic PocketIC transport and teardown
        run: cargo test -p ic-testkit --locked --offline --test pocket_ic_teardown
      - name: Check native fixture benchmark driver and sampler
        run: cargo test -p ic-testkit --locked --offline --example fixture_reuse_benchmark_driver

  pocket-ic-concurrency:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_TESTKIT_INTERNAL_TOOLCHAIN }}
      - name: Pin cargo/rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TESTKIT_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Run PocketIC ownership concurrency tests
        run: cargo test -p ic-testkit --locked --test pocket_ic_concurrency -- --nocapture
