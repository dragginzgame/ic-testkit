name: CI

env:
  IC_TESTKIT_MSRV: 1.88.0
  IC_TESTKIT_INTERNAL_TOOLCHAIN: 1.99.0

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Atomic releases push main and its tag at the same SHA. Main owns source
  # qualification; a second tag matrix would repeat every heavy native gate.
  push:
    branches:
      - main
  pull_request:

jobs:
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_TESTKIT_MSRV }}
          targets: wasm32-unknown-unknown
      - name: Pin cargo/rustc to MSRV
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TESTKIT_MSRV" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Check MSRV
        run: make msrv

  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: true
          fetch-depth: 0
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_TESTKIT_INTERNAL_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Pin cargo/rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TESTKIT_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare complete common and product tools
        shell: bash
        run: |
          make install-tools 2>&1 | tee "$RUNNER_TEMP/ic-testkit-tools-install.log"
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" "$GITHUB_WORKSPACE/.tools/ic/bin" "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
          server="$(target/debug/ic-testkit-server check)"
          echo "POCKET_IC_BIN=$server" >> "$GITHUB_ENV"
      - name: Prepare selected dependencies
        run: cargo fetch --locked
      - name: Run complete CI gate
        shell: bash
        run: make ci 2>&1 | tee "$RUNNER_TEMP/ic-testkit-validation.log"
      - name: Archive failed validation and installer evidence
        if: failure()
        id: checks-evidence
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        env:
          IC_TESTKIT_FAILURE_STEPS: ${{ toJSON(steps) }}
        run: |
          archive="$(bash scripts/ci/collect-failure-evidence.sh checks)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Retain failed validation and installer evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checks-failure-${{ matrix.os }}
          path: ${{ steps.checks-evidence.outputs.archive }}
          retention-days: 14
          if-no-files-found: error

  portable-hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_TESTKIT_INTERNAL_TOOLCHAIN }}
          components: rustfmt
      - name: Pin cargo/rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TESTKIT_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare complete common and product tools with the system Bash
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        run: |
          make install-tools 2>&1 | tee "$RUNNER_TEMP/ic-testkit-tools-install.log"
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" "$GITHUB_WORKSPACE/.tools/ic/bin" "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
          server="$(target/debug/ic-testkit-server check)"
          echo "POCKET_IC_BIN=$server" >> "$GITHUB_ENV"
      - name: Select system Bash on macOS
        if: runner.os == 'macOS'
        run: echo /bin >> "$GITHUB_PATH"
      - name: Prepare selected dependencies
        run: cargo fetch --locked
      - name: Verify portable operator tooling with the system Bash
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        env:
          TMPDIR: ${{ runner.temp }}/ic-testkit-portable-fixtures
        run: |
          mkdir -p "$TMPDIR"
          /bin/bash scripts/ci/verify-shared-tooling-snapshot.sh
          make tools-check dependency-pins-check
          /bin/bash scripts/ci/test-host-tools.sh
          /bin/bash scripts/ci/test-ic-tools.sh
          /bin/bash scripts/ci/test-rust-tools.sh
          /bin/bash scripts/ci/test-dependency-pins.sh
          CDPATH="$PWD" /bin/bash scripts/ci/check-release-guards.sh
          CDPATH="$PWD" /bin/bash scripts/ci/test-release-runner.sh
          CDPATH="$PWD" /bin/bash scripts/ci/check-installation-version.sh
          CDPATH="$PWD" /bin/bash scripts/ci/check-publish-guards.sh
          CDPATH="$PWD" /bin/bash scripts/ci/check-git-hooks.sh
          make fmt-check
      - name: Qualify failure evidence archives
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        env:
          IC_TESTKIT_ARCHIVE_PROOF_DIR: ${{ runner.temp }}/ic-testkit-archive-proof
          TMPDIR: ${{ runner.temp }}/ic-testkit-portable-fixtures
        run: CDPATH="$PWD" /bin/bash scripts/ci/test-failure-evidence.sh
      - name: Upload archive qualification artifact
        id: archive-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-qualification-${{ matrix.os }}
          path: ${{ runner.temp }}/ic-testkit-archive-proof/evidence.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Check returned archive identity
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        env:
          ARCHIVE_ID: ${{ steps.archive-upload.outputs.artifact-id }}
        run: |
          [[ "$ARCHIVE_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'upload returned no valid artifact ID' >&2; exit 1; }
          mkdir "$RUNNER_TEMP/ic-testkit-archive-downloaded"
      - name: Download archive qualification artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.archive-upload.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/ic-testkit-archive-downloaded
      - name: Verify downloaded evidence archive
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        env:
          TMPDIR: ${{ runner.temp }}/ic-testkit-portable-fixtures
        run: CDPATH="$PWD" /bin/bash scripts/ci/test-failure-evidence.sh verify "$RUNNER_TEMP/ic-testkit-archive-downloaded/evidence.tar.gz"
      - name: Check native managed-server lifecycle
        run: cargo test -p ic-testkit --locked --offline --lib pic::startup::tests
      - name: Check shared host-tool integration and artifact helpers
        run: |
          cargo test -p ic-testkit --locked --offline --lib artifacts::host_tests
          cargo test -p ic-testkit --locked --offline --test artifact_helpers
      - name: Check synthetic PocketIC transport and teardown
        run: cargo test -p ic-testkit --locked --offline --test pocket_ic_teardown
      - name: Check native fixture benchmark driver and sampler
        run: cargo test -p ic-testkit --locked --offline --example fixture_reuse_benchmark_driver
      - name: Archive failed portable and installer evidence
        if: failure()
        id: portable-evidence
        shell: /bin/bash --noprofile --norc -e -u -o pipefail {0}
        env:
          IC_TESTKIT_FAILURE_STEPS: ${{ toJSON(steps) }}
        run: |
          archive="$(bash scripts/ci/collect-failure-evidence.sh portable)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Retain failed portable and installer evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portable-failure-${{ matrix.os }}
          path: ${{ steps.portable-evidence.outputs.archive }}
          retention-days: 14
          if-no-files-found: error

  pocket-ic-concurrency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_TESTKIT_INTERNAL_TOOLCHAIN }}
      - name: Pin cargo/rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_TESTKIT_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare complete common and product tools
        shell: bash
        run: |
          make install-tools
          make tools-check
          server="$(target/debug/ic-testkit-server check)"
          echo "POCKET_IC_BIN=$server" >> "$GITHUB_ENV"
      - name: Prepare selected dependencies
        run: cargo fetch --locked
      - name: Run PocketIC ownership concurrency tests
        run: cargo test -p ic-testkit --locked --offline --test pocket_ic_concurrency -- --nocapture
      - name: Qualify provisioning and managed launch without consumer pins
        run: cargo test -p ic-testkit --locked --offline --test server_runner provisioned_cli_runs_a_real_instance_without_consumer_server_selection -- --ignored --exact
      - name: Qualify real managed-server CLI execution
        run: cargo test -p ic-testkit --locked --offline --test server_runner real_server_runs_a_separate_process_using_environment_startup -- --ignored --exact
      - name: Qualify idle lifetime during pre-client work
        run: cargo test -p ic-testkit --locked --offline --test server_runner managed_idle_ttl_allows_preclient_work_beyond_server_default -- --ignored --exact
      - name: Retain idle lifetime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: idle-lifetime-${{ matrix.os }}
          path: target/idle-lifetime-*
          retention-days: 14
          if-no-files-found: warn
