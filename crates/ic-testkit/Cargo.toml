[package]
name = "ic-testkit"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
reply-fixtures = ["dep:wasm-encoder"]

[dependencies]
candid = { workspace = true }
ic-metrics = { workspace = true }

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ic-host-artifacts = { workspace = true }
ic-host-fs = { workspace = true }
ic-host-process = { workspace = true }
ic-testkit-candid = { workspace = true }
pocket-ic = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
wasm-encoder = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-cdk = { workspace = true }

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dev-dependencies]
ic-host-process = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = { workspace = true }
wasmparser = { workspace = true }

[lints]
workspace = true
