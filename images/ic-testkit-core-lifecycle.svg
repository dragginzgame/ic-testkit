<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" role="img" aria-labelledby="title desc">
  <title id="title">IC Testkit core lifecycle: restore or rebuild</title>
  <desc id="desc">Run a test, then validate whether the environment is safe to reuse. If safe to reuse, restore it before the next test. If unsafe to reuse, rebuild it before the next test. Both branches return to the next test.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71859A"/></marker>
    <marker id="restore-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#218B70"/></marker>
    <marker id="rebuild-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B47420"/></marker>
  </defs>
  <rect width="1280" height="910" fill="#F7FAFD"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102B50">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#53718F">IC TESTKIT · CORE LIFECYCLE</text>
    <text x="56" y="107" font-size="34" font-weight="700">Restore when safe. Rebuild when needed.</text>
    <text x="56" y="143" font-size="19" fill="#53718F">Validate reuse safety before preparing the next test.</text>
    <rect x="56" y="182" width="1168" height="668" rx="22" fill="white" stroke="#D7E3EF" stroke-width="1.5"/>

    <rect x="440" y="218" width="400" height="72" rx="14" fill="#EDF3F9" stroke="#B8CBDF" stroke-width="1.5"/>
    <text x="640" y="262" font-size="25" font-weight="700" text-anchor="middle">Next test</text>
    <path d="M640 293V331" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="440" y="347" width="400" height="72" rx="14" fill="#102B50"/>
    <text x="640" y="391" font-size="25" font-weight="700" text-anchor="middle" fill="white">Run test</text>
    <path d="M640 422V460" fill="none" stroke="#71859A" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="370" y="476" width="540" height="92" rx="16" fill="#F5F1FD" stroke="#7354C6" stroke-width="2"/>
    <text x="640" y="514" font-size="25" font-weight="700" text-anchor="middle">Validate</text>
    <text x="640" y="545" font-size="19" text-anchor="middle" fill="#53718F">Is the environment safe to reuse?</text>

    <path d="M640 571V601H350V643" fill="none" stroke="#218B70" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#restore-arrow)"/>
    <path d="M640 601H930V643" fill="none" stroke="#B47420" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#rebuild-arrow)"/>
    <circle cx="640" cy="601" r="5" fill="#7354C6"/>
    <rect x="270" y="583" width="160" height="34" rx="17" fill="white"/>
    <text x="350" y="606" font-size="18" font-weight="700" text-anchor="middle" fill="#20765E">Safe to reuse</text>
    <rect x="838" y="583" width="184" height="34" rx="17" fill="white"/>
    <text x="930" y="606" font-size="18" font-weight="700" text-anchor="middle" fill="#95601C">Unsafe to reuse</text>

    <rect x="220" y="659" width="260" height="76" rx="16" fill="#EAF7F1" stroke="#9BD3BD" stroke-width="1.5"/>
    <text x="350" y="706" font-size="27" font-weight="700" text-anchor="middle" fill="#20765E">Restore</text>
    <rect x="800" y="659" width="260" height="76" rx="16" fill="#FFF6E8" stroke="#E4C493" stroke-width="1.5"/>
    <text x="930" y="706" font-size="27" font-weight="700" text-anchor="middle" fill="#95601C">Rebuild</text>

    <path d="M350 738V784H126V254H424" fill="none" stroke="#218B70" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#restore-arrow)"/>
    <path d="M930 738V784H1154V254H856" fill="none" stroke="#B47420" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#rebuild-arrow)"/>
    <text x="640" y="815" font-size="18" text-anchor="middle" fill="#53718F">Both paths prepare the environment for the next test.</text>
  </g>
</svg>
